<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | College Resource Booking</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <div id="sidebar"></div>

    <main class="main">
      <div class="page-header">
        <h1 id="welcome">Admin Dashboard</h1>
        <p>Overview of all resources and booking requests in the system.</p>
      </div>

      <div id="msg"></div>
      <div class="stat-grid" id="stats"></div>

      <div class="card">
        <div class="card-title">Latest pending requests</div>
        <div id="pending"><p class="empty">Loading&hellip;</p></div>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/admin-dashboard.js"></script>
</body>
</html>
