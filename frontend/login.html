<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | College Resource Booking</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="logo"><div class="logo-mark">&#127979;</div></div>
      <h1>College Resource Booking</h1>
      <p class="subtitle">Sign in to book classrooms, labs and equipment</p>

      <div id="msg"></div>

      <form id="loginForm">
        <div class="form-row">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@college.com" autocomplete="email">
        </div>

        <div class="form-row">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Your password" autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Log in</button>
      </form>

      <p class="auth-footer">
        Don't have an account? <a href="register.html">Create one</a>
      </p>

      <div class="demo-box">
        <strong>Demo accounts</strong>
        Admin: <code>admin@college.com</code> / <code>Admin123!</code><br>
        Student: <code>student@college.com</code> / <code>Demo123!</code><br>
        Faculty: <code>faculty@college.com</code> / <code>Demo123!</code>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script>
    // Already logged in? Go straight to the right dashboard.
    if (isLoggedIn()) window.location.replace(dashboardFor(getUser().role));

    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      clearMessage("msg");

      const button = document.getElementById("submitBtn");
      button.disabled = true;
      button.textContent = "Signing in...";

      try {
        const result = await api.login({
          email:    document.getElementById("email").value.trim(),
          password: document.getElementById("password").value
        });

        saveSession(result);
        // Role-based redirect: the admin goes somewhere different.
        window.location.href = dashboardFor(result.role);
      } catch (error) {
        showMessage("msg", "error", error.message);
        button.disabled = false;
        button.textContent = "Log in";
      }
    });
  </script>
</body>
</html>
