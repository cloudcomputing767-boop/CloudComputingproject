<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Meeting room">
  <defs><linearGradient id="mr" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f2eef7"/><stop offset="1" stop-color="#e2dcee"/></linearGradient></defs>
  <rect width="400" height="260" fill="url(#mr)"/>
  <rect x="0" y="202" width="400" height="58" fill="#cfc7e0"/>
  <!-- wall screen -->
  <rect x="122" y="30" width="156" height="72" rx="5" fill="#ffffff" stroke="#bdb2d4" stroke-width="3"/>
  <path d="M146 56h64M146 74h96" stroke="#c9bfe0" stroke-width="6" stroke-linecap="round"/>
  <!-- table -->
  <ellipse cx="200" cy="168" rx="122" ry="44" fill="#1f4e79"/>
  <ellipse cx="200" cy="162" rx="122" ry="44" fill="#2e6699"/>
  <ellipse cx="200" cy="162" rx="92" ry="30" fill="#3d79b0" opacity=".55"/>
  <!-- laptops on table -->
  <g fill="#e8eef6">
    <rect x="166" y="146" width="30" height="18" rx="3"/><rect x="214" y="150" width="28" height="16" rx="3"/>
  </g>
  <!-- people -->
  <g fill="#8a7fb0">
    <circle cx="200" cy="106" r="15"/><circle cx="118" cy="132" r="15"/><circle cx="282" cy="132" r="15"/>
    <circle cx="146" cy="206" r="15"/><circle cx="254" cy="206" r="15"/>
  </g>
  <g fill="#9d93c0">
    <path d="M185 126a15 15 0 0 1 30 0z"/><path d="M103 152a15 15 0 0 1 30 0z"/><path d="M267 152a15 15 0 0 1 30 0z"/>
  </g>
</svg>
