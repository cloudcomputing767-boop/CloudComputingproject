    <circle cx="60"  cy="192" r="11"/><circle cx="130" cy="192" r="11"/><circle cx="200" cy="192" r="11"/><circle cx="270" cy="192" r="11"/><circle cx="340" cy="192" r="11"/>
    <circle cx="48"  cy="224" r="11"/><circle cx="124" cy="224" r="11"/><circle cx="200" cy="224" r="11"/><circle cx="276" cy="224" r="11"/><circle cx="352" cy="224" r="11"/>
