<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | College Resource Booking</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <div id="sidebar"></div>

    <main class="main">
      <div class="page-header">
        <h1 id="welcome">Welcome</h1>
        <p id="subtitle">Here is an overview of your bookings.</p>
      </div>

      <div id="msg"></div>

      <div class="stat-grid" id="stats"></div>

      <div class="card">
        <div class="card-title">Available Resources &mdash; click a picture to book</div>
        <div id="resources" class="resource-grid">
          <p class="empty">Loading resources&hellip;</p>
        </div>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/resource-card.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
